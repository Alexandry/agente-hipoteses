<div class="chat-container">
  
  <div class="messages-area" #scrollMe>
    <div class="messages-wrapper">
      <app-chat-message 
        *ngFor="let msg of messages$ | async" 
        [message]="msg">
      </app-chat-message>
      
      <!-- Typing Indicator -->
      <div class="typing-indicator-wrapper" *ngIf="isTyping">
        <div class="avatar bot-avatar">
          <span>🤖</span>
        </div>
        <div class="typing-bubble">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea 
        [(ngModel)]="inputText" 
        placeholder="Descreva uma ideia, problema ou objetivo..."
        (keyup.enter)="sendMessage()"
        [disabled]="isTyping"
      ></textarea>
      <button class="send-btn" (click)="sendMessage()" [disabled]="!inputText.trim() || isTyping">
        <span class="send-icon">➤</span>
      </button>
    </div>
  </div>

</div>
