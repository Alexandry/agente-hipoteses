<header class="sidebar-header">
  <div class="logo-icon">✨</div>
  <div class="titles">
    <h1>Agente de Hipóteses</h1>
    <h2>IA Multiagente</h2>
  </div>
</header>

<section class="context-section">
  <div class="section-title">
    <h3>Contexto do Projeto</h3>
    <button class="collapse-btn">‹</button>
  </div>

  <div class="form-group">
    <label for="premissas">Premissas</label>
    <textarea id="premissas" [(ngModel)]="premises" placeholder="Defina as premissas do projeto..."></textarea>
  </div>

  <div class="form-group">
    <label for="publico-alvo">Público-alvo</label>
    <textarea id="publico-alvo" [(ngModel)]="targetAudience" placeholder="Descreva o público-alvo..."></textarea>
  </div>

  <button class="btn-primary" (click)="saveContext()">Salvar contexto</button>

  <div class="documents-section">
    <h4>Documentos (0)</h4>
    <div class="dropzone">
      <div class="doc-icon">📄</div>
      <span>Nenhum documento</span>
    </div>
  </div>
</section>

<section class="history-section">
  <div class="section-title">
    <h3>Histórico</h3>
    <button class="collapse-btn">‹</button>
  </div>
  
  <ul class="history-menu">
    <li>
      <button class="menu-item" (click)="goToIdeias()">
        <span class="icon">💡</span>
        <span>Ideias</span>
      </button>
    </li>
    <li>
      <button class="menu-item" (click)="goToHipoteses()">
        <span class="icon">☑️</span>
        <span>Hipóteses</span>
      </button>
    </li>
  </ul>
</section>
